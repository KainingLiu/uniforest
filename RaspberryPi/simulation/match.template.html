<div id="uniforest-match">
  <h2>Uniforest · 一次比赛的全过程</h2>
  <div class="viz-controls">
    <label class="form-label" for="um-plan">比赛策略<select id="um-plan" class="form-select" aria-label="比赛策略"><option value="PlanA">PlanA · 三轮采集搭建</option><option value="PlanB">PlanB · 先暂存再搭建</option></select></label>
    <label class="form-label" for="um-motion">运动模式<select id="um-motion" class="form-select" aria-label="运动模式"><option value="continuous" selected>连续曲线（候选）</option><option value="stop_turn">原分段停走</option></select></label>
    <label class="form-label" for="um-view">视图<select id="um-view" class="form-select" aria-label="视图"><option value="top">场地俯视</option><option value="field" selected>场地立体</option><option value="local">当前路线特写</option></select></label>
  </div>
  <div class="viz-row">
    <button type="button" class="btn btn-primary" id="um-start">从启动区运行整局</button>
    <button type="button" class="btn" id="um-pause">继续播放</button>
    <label class="form-label" for="um-speed">播放速度<select id="um-speed" class="form-select" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8" selected>8×</option><option value="16">16×</option></select></label>
  </div>
  <p class="text-small um-note">名义全流程回放 · 车位连续传递 · 感知、抓取成功和机构时长使用显式假设</p>
  <div id="um-action" class="um-action" aria-live="polite"></div>
  <div class="viz-row"><span id="um-curve" class="text-small"></span><button type="button" class="btn" id="um-first-curve">看首段连续转弯</button></div>
  <div class="viz-row tabular-nums"><span id="um-cargo"></span><span id="um-builds"></span><span id="um-resource"></span></div>
  <canvas id="um-map" role="img" aria-label="机器人从启动区出发，连续完成取块、运输、卸货、搭建和返程，方块去向随动作更新">完整比赛过程与场上方块状态。</canvas>
  <div class="viz-row tabular-nums"><span id="um-clock"></span><span id="um-velocity"></span><span id="um-progress"></span></div>
  <label class="form-label" for="um-time">整场时间<input id="um-time" type="range" min="0" max="10000" value="0" class="form-range" aria-label="整场时间"></label>
  <div class="text-small" id="um-stage"></div>
  <div class="text-small" id="um-check"></div>
  <div class="text-small">实线：当前运动方式；虚线：同一动作的另一种方式。</div>
  <div class="table-responsive"><table class="table table-sm tabular-nums"><thead><tr><th>方式</th><th>源码移动</th><th>名义校正</th><th>整局时间</th></tr></thead><tbody id="um-comparison"></tbody></table></div>
  <div id="um-waits" class="text-small"></div>
  <details><summary>完整动作时间线与仿真假设</summary>
    <label class="form-label" for="um-event">跳到某个比赛动作<select id="um-event" class="form-select" aria-label="跳到某个比赛动作"></select></label>
    <dl id="um-assumptions" class="text-small"></dl>
  </details>
</div>
<style>
#uniforest-match{width:100%;}#uniforest-match canvas{display:block;width:100%;height:450px;}#uniforest-match .um-note{color:var(--muted-foreground);margin:10px 0;}#uniforest-match .um-action{font-weight:500;margin-top:12px;}#uniforest-match dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;}#uniforest-match dd{margin:0;overflow-wrap:anywhere;}#uniforest-match summary{margin-top:12px;}#uniforest-match #um-check{color:var(--muted-foreground);margin-top:6px;}@media(max-width:480px){#uniforest-match dl{grid-template-columns:1fr;}}
</style>
<script type="application/json" id="um-data">__MATCH_DATA__</script>
<script>
(() => {
 'use strict';
 const root=document.getElementById('uniforest-match'),data=JSON.parse(document.getElementById('um-data').textContent),q=id=>root.querySelector('#um-'+id);
 const canvas=q('map'),ctx=canvas.getContext('2d'),probe=document.createElement('span');probe.hidden=true;root.appendChild(probe);
 let name='PlanA',motion='continuous',t=0,playing=false,last=0,request=0,w=736,h=480,lastEvent=-1;
 let colors={},project=()=>({x:0,y:0});
 const f=(v,d=1)=>Number.isFinite(v)?v.toFixed(d):'—',rad=a=>a*Math.PI/180;
 const match=()=>data.matches.find(m=>m.plan===name&&m.route_mode===motion),end=()=>match().points[match().points.length-1].t;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function palette(){const color=k=>{probe.style.color='var('+k+')';return getComputedStyle(probe).color;};colors={fg:color('--foreground'),border:color('--border'),bg:color('--background'),surface:color('--muted'),muted:color('--muted-foreground'),car:color('--viz-series-1'),orange:color('--orange'),purple:color('--purple'),warning:color('--destructive')};}
 function atTime(items,clock,key='t'){let a=0,b=items.length;while(a<b){const mid=(a+b)>>1;if(items[mid][key]<=clock)a=mid+1;else b=mid;}return Math.max(0,a-1);}
 function pose(){const points=match().points,i=atTime(points,t),a=points[i],b=points[Math.min(i+1,points.length-1)],u=b.t>a.t?Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t))):0;return {...Object.fromEntries(['x','y','yaw','vx','vy','wz'].map(k=>[k,(a[k]||0)+((b[k]||0)-(a[k]||0))*u])),stage:a.stage,action:a.action};}
 function state(){return match().state_frames[atTime(match().state_frames,t)];}
 function event(){return match().events[atTime(match().events,t,'t0')];}
 function raw(x,y,z,view){return view==='top'||view==='local'?{x,y}:{x:.84*x-.60*y,y:.37*x+.43*y-.88*z};}
 function projection(){const view=q('view').value,b=[];if(view==='local'){const current=event();for(const m of data.matches.filter(m=>m.plan===name)){const e=m.events.find(e=>e.name===current.name);for(const p of m.points.filter(p=>p.t>=e.t0&&p.t<=e.t1)){b.push({x:p.x-500,y:p.y-500},{x:p.x+500,y:p.y+500});}}}else{for(const x of[0,data.field.width_mm])for(const y of[0,data.field.height_mm])for(const z of[0,750])b.push(raw(x,y,z,view));for(const m of data.matches.filter(m=>m.plan===name))for(const p of m.points)b.push(raw(p.x,p.y,0,view));}const xs=b.map(p=>p.x),ys=b.map(p=>p.y),loX=Math.min(...xs),loY=Math.min(...ys),hiX=Math.max(...xs),hiY=Math.max(...ys),scale=Math.min((w-40)/(hiX-loX),(h-45)/(hiY-loY)),ox=(w-(hiX-loX)*scale)/2-loX*scale,oy=(h-(hiY-loY)*scale)/2-loY*scale;project=(x,y,z=0)=>{const p=raw(x,y,z,view);return{x:ox+p.x*scale,y:oy+p.y*scale};};}
 function poly(points,fill,alpha=1,stroke=colors.border){if(!points.length)return;ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}ctx.restore();}
 function line(points,color,alpha=1,dash=[]){if(points.length<2)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=alpha;ctx.setLineDash(dash);ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();}
 function text(value,x,y,color=colors.fg,align='center'){ctx.fillStyle=color;ctx.font='12px system-ui,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(value,x,y);}
 function heightAt(s,x,y){if(s.kind!=='ramp')return s.height_mm||0;const mid=e=>({x:(e[0][0]+e[1][0])/2,y:(e[0][1]+e[1][1])/2}),a=mid(s.low_edge),b=mid(s.high_edge),dx=b.x-a.x,dy=b.y-a.y;return Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy)))*s.height_mm;}
 function elevation(x,y){for(const s of data.field.shapes){if(!['platform','ramp'].includes(s.kind))continue;const xs=s.polygon.map(p=>p[0]),ys=s.polygon.map(p=>p[1]);if(x>=Math.min(...xs)&&x<=Math.max(...xs)&&y>=Math.min(...ys)&&y<=Math.max(...ys))return heightAt(s,x,y);}return 0;}
 function field(){const view=q('view').value;poly([[0,0],[4800,0],[4800,7200],[0,7200]].map(p=>project(...p)),colors.surface,.2);const labels=[];for(const s of data.field.shapes){const base=s.polygon.map(p=>project(...p)),top=s.polygon.map(p=>project(...p,heightAt(s,...p)));if(view==='field'&&s.height_mm>0){for(let i=0;i<top.length;i++){const j=(i+1)%top.length;poly([base[i],base[j],top[j],top[i]],colors.fg,s.collision?.17:.07);}}poly(top,s.collision?colors.fg:colors.surface,s.collision?.18:.45);if(['start','building','platform'].includes(s.kind)){const x=s.polygon.reduce((sum,p)=>sum+p[0],0)/s.polygon.length,y=s.polygon.reduce((sum,p)=>sum+p[1],0)/s.polygon.length,p=project(x,y,heightAt(s,x,y));if(!labels.some(l=>Math.abs(l.x-p.x)<75&&Math.abs(l.y-p.y)<18)){text(s.label,p.x,p.y);labels.push(p);}}}text('4.8 × 7.2 m',10,h-12,colors.muted,'left');}
 function box(x,y,z,length,width,height,yaw,color){const a=rad(yaw),co=Math.cos(a),si=Math.sin(a),v=[];for(const dz of[-.5,.5])for(const xy of[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]])v.push(project(x+co*xy[0]*length-si*xy[1]*width,y+si*xy[0]*length+co*xy[1]*width,z+dz*height));if(q('view').value==='top'){poly(v.slice(4),color,.8);return;}for(const ids of[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]])poly(ids.map(i=>v[i]),color,.65);}
 function robot(p){const a=rad(p.yaw),co=Math.cos(a),si=Math.sin(a),ground=elevation(p.x,p.y),r=data.robot;if(q('view').value==='field'){const parts=r.boxes.slice().sort((b,c)=>(co*b.x-si*b.y+si*b.x+co*b.y)-(co*c.x-si*c.y+si*c.x+co*c.y));for(const b of parts)box(p.x+co*b.x-si*b.y,p.y+si*b.x+co*b.y,ground+b.z,b.length,b.width,b.height,p.yaw,b.kind==='wheel'?colors.fg:colors.car);}else{const shift=(r.front_extent_mm-r.rear_extent_mm)/2;box(p.x+co*shift,p.y+si*shift,ground+50,r.length_mm,r.width_mm,100,p.yaw,colors.car);}const head=project(p.x+co*r.front_extent_mm,p.y+si*r.front_extent_mm,ground+10),center=project(p.x,p.y,ground+10);line([center,head],colors.car);ctx.beginPath();ctx.arc(head.x,head.y,3,0,Math.PI*2);ctx.fillStyle=colors.car;ctx.fill();}
 function cube(id,x,y,z=400){const c=match().initial_cubes.find(c=>c.id===id),color=c?.color==='purple'?colors.purple:colors.orange;box(x,y,z+50,100,100,100,0,color);}
 function draw(){palette();projection();ctx.clearRect(0,0,w,h);field();const m=match(),p=pose(),s=state(),e=event();const seen=m.points.filter(pt=>pt.t<=t);line(seen.map(pt=>project(pt.x,pt.y,elevation(pt.x,pt.y)+8)),colors.car,.22);if(e){const other=data.matches.find(c=>c.plan===name&&c.route_mode!==motion),oe=other?.events.find(c=>c.name===e.name);if(oe){const reference=other.points.filter(pt=>pt.t>=oe.t0&&pt.t<=oe.t1);line(reference.map(pt=>project(pt.x,pt.y,elevation(pt.x,pt.y)+10)),colors.muted,.8,[5,4]);}const planned=m.points.filter(pt=>pt.t>=e.t0&&pt.t<=e.t1);line(planned.map(pt=>project(pt.x,pt.y,elevation(pt.x,pt.y)+12)),colors.car,.7);const route=planned.filter(pt=>pt.t<=t);line(route.map(pt=>project(pt.x,pt.y,elevation(pt.x,pt.y)+12)),colors.car,1);}
  for(const id of s.remaining){const c=m.initial_cubes.find(c=>c.id===id);if(c)cube(id,c.x??c.x_mm,c.y??c.y_mm,c.z??c.z_mm??400);}
  const stackLabels=[];
  for(const pile of s.placements){if(!pile.cubes.length)continue;pile.cubes.forEach((id,i)=>cube(id,pile.x,pile.y,100+i*100));const v=project(pile.x,pile.y,130+pile.cubes.length*100);stackLabels.push({...v,label:(pile.role==='base'?'基座 ':'暂存 ')+pile.cubes.length});}
  for(const tower of s.buildings){if(!tower.layers.length)continue;tower.layers.forEach((id,i)=>cube(id,tower.x,tower.y,100+i*100));const v=project(tower.x,tower.y,150+tower.layers.length*100);stackLabels.push({...v,label:tower.layers.length+' 层'});}
  let lastLabel=null;for(const label of stackLabels.sort((a,b)=>a.x-b.x)){const size=label.label.length*12;let x=label.x;if(lastLabel&&Math.abs(lastLabel.y-label.y)<20)x=Math.max(x,lastLabel.x+(lastLabel.size+size)/2+4);x=Math.min(w-size/2-6,x);if(x!==label.x)line([{x:label.x,y:label.y+6},{x,y:label.y}],colors.muted,.7);text(label.label,x,label.y);lastLabel={x,y:label.y,size};}
  robot(p);s.cargo.forEach((id,i)=>cube(id,p.x,p.y,elevation(p.x,p.y)+140+i*100));
  const orange=s.cargo.filter(id=>m.initial_cubes.find(c=>c.id===id)?.color==='orange').length;const purple=s.cargo.length-orange;
  q('cargo').textContent='携带 '+orange+' 橙 + '+purple+' 紫 / 3';q('builds').textContent='完成搭建 '+s.build_count+' 次';q('resource').textContent='材料区剩余 '+s.remaining.length+' 块';q('clock').textContent=f(t)+' / '+f(end())+' s（仿真）';q('velocity').textContent='车速 '+f(Math.hypot(p.vx,p.vy),0)+' mm/s';q('progress').textContent='动作 '+(e?e.index+1:0)+' / '+m.events.length;q('time').value=String(Math.round(t/end()*10000));
  const stages={search_cube:'观察并搜索方块',cube_aligned:'方块对准确认',grap1_lift:'高地橙块抬升',grap2_lift:'紫块抬升',grap3_lift:'地面橙块抬升',grap1_restore:'收回并存入舱内',grap2_restore:'收回并存入舱内',grap3_restore:'收回并存入舱内',build_release_1:'放置第一个方块',build_release_2:'放置第二个方块',build_release_3:'放置第三个方块',build_restore:'搭建机构回收',inspect_cargo:'相机检查舱内数量',hatch_open:'开舱卸货',load_staged:'装载暂存方块',tag_aligned:'Tag 定位确认',building_aligned:'建筑对准确认',wall_confirm:'靠墙确认',wall_unknown:'名义接触等待',initial_move:'出发/接近移动',delivery_route:'运输至投放区',build_route:'前往搭建区',post_build_route:'搭建后返程',post_build_reverse:'搭建后退离'};
  q('stage').textContent='当前阶段：'+(stages[p.stage]||e?.label||'准备');
  const run=(m.curve_runs||[]).find(r=>r.name===e?.name&&t>=r.t0&&t<=r.t1);q('curve').textContent=run?.curve_enabled?'本动作使用连续曲线：'+run.source_motion_leg_count+' 段运动 → '+run.prefix_controller_runs+' 条轨迹；靠墙边界保留。':motion==='continuous'?'本局 '+m.metrics.curve_enabled_runs+' 次曲线，其中 '+m.metrics.curve_multi_leg_runs+' 次合并多段运动。':'原分段模式：各运动段独立结束停车。';
  if(e&&e.index!==lastEvent){q('action').textContent=name+' · '+(e.index+1)+'/'+m.events.length+' · '+e.label+(e.status.startsWith('skipped')?'（跳过）':'');q('event').value=String(e.index);lastEvent=e.index;}
  if(t>=end()){q('action').textContent=name+(['completed','nominal_completed'].includes(m.status)?' 名义比赛流程结束':' 回放中止')+' · 搭建 '+s.build_count+' 次';q('stage').textContent='材料去向已记录；完整动作与假设可在下方查看。';}
 }
 function resize(){w=Math.max(280,canvas.getBoundingClientRect().width);h=q('view').value==='top'?Math.min(650,w*1.4):Math.max(280,Math.min(510,w*.7));canvas.style.height=h+'px';const dpr=window.devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
 function setup(){lastEvent=-1;q('plan').value=name;q('motion').value=motion;q('event').innerHTML=match().events.map(e=>'<option value="'+e.index+'">'+(e.index+1)+'. '+esc(e.label)+' · '+f(e.t0)+'s</option>').join('');const hits=match().field_assessment?.collision_count||0;q('check').textContent=(hits?'本次名义路线存在 '+hits+' 段平面包络干涉。':'本次演示未检出平面包络干涉。')+'干涉仅记录，未模拟接触力或实机失败恢复。';const pair=data.matches.filter(m=>m.plan===name);q('comparison').innerHTML=pair.map(m=>'<tr><td>'+(m.route_mode==='continuous'?'连续曲线':'原分段')+(m.status==='failed'?'（中止）':'')+'</td><td>'+f(m.metrics.source_motion_elapsed_s,2)+' s</td><td>'+f(m.metrics.nominal_correction_elapsed_s,2)+' s</td><td>'+f(m.metrics.elapsed_s,2)+' s</td></tr>').join('');const base=pair.find(m=>m.route_mode==='stop_turn'),curve=pair.find(m=>m.route_mode==='continuous'),saved=base.metrics.source_motion_elapsed_s-curve.metrics.source_motion_elapsed_s;q('waits').textContent=pair.every(m=>m.status==='nominal_completed')?'本场景源码移动减少 '+f(saved,2)+' s；感知/机构等待两种方式均为 '+f(base.metrics.nominal_wait_elapsed_s,2)+' s。':'有模式未完成，部分耗时不能当作整局收益。';q('assumptions').innerHTML='<dt>动作来源</dt><dd>'+name+' 当前源码的全部 '+match().events.length+' 个功能动作。</dd><dt>曲线执行</dt><dd>当前入口与补偿量生成航点，经真实 run_curve / follow_trajectory 驱动虚拟轮速；保留靠墙、定位与最终停车边界。</dd><dt>世界状态</dt><dd>使用稳定方块 ID 记录材料区、携带、暂存和建筑，保持物资守恒。</dd><dt>时序</dt><dd>感知/机构采用相同假设并单独计时；未复现全部机构并行衔接。曲线时间差属于仿真结果。</dd><dt>位姿</dt><dd>单一起点连续推进；虚线为对应动作的另一种模式，两者入口可能有此前跟踪残差。</dd><dt>验证边界</dt><dd>计划书夹爪 CAD、名义全局锚点；平滑候选没有自动避障或实机校准。</dd>';resize();}
 function save(){try{window.openai?.setWidgetState({modelContent:{plan:name,motion,view:q('view').value,event:event()?.name},privateContent:{time:t,speed:q('speed').value}})?.catch(()=>{});}catch(_){}}
 function stop(remember=true){playing=false;q('pause').textContent='继续播放';if(remember)save();}
 function tick(now){if(!playing){request=0;return;}const dt=last?Math.min((now-last)/1000,.15):0;last=now;t=Math.min(end(),t+dt*Number(q('speed').value));draw();if(t>=end()){stop();request=0;}else request=requestAnimationFrame(tick);}
 function play(){if(t>=end())t=0;playing=true;last=0;q('pause').textContent='暂停';if(!request)request=requestAnimationFrame(tick);}
 q('start').addEventListener('click',()=>{t=0;lastEvent=-1;play();draw();});q('pause').addEventListener('click',()=>playing?stop():play());q('plan').addEventListener('change',()=>{stop(false);name=q('plan').value;t=0;setup();save();});q('view').addEventListener('change',()=>{resize();save();});q('speed').addEventListener('change',save);q('time').addEventListener('input',()=>{stop(false);t=Number(q('time').value)/10000*end();draw();});q('time').addEventListener('change',save);q('event').addEventListener('change',()=>{stop(false);t=match().events[Number(q('event').value)].t0;draw();save();});
 q('motion').addEventListener('change',()=>{const e=event(),u=e.t1>e.t0?Math.max(0,Math.min(1,(t-e.t0)/(e.t1-e.t0))):0;stop(false);motion=q('motion').value;const n=match().events.find(n=>n.name===e.name);t=n.t0+u*(n.t1-n.t0);setup();save();});
 q('first-curve').addEventListener('click',()=>{stop(false);motion='continuous';const run=match().curve_runs.find(r=>r.curve_enabled&&r.multi_leg);t=run?run.t0:0;setup();play();save();});
 function restore(s){const m=s?.modelContent||{},p=s?.privateContent||{};if(!['PlanA','PlanB'].includes(m.plan))return;name=m.plan;if(['field','top','local'].includes(m.view))q('view').value=m.view;if(['1','2','4','8','16'].includes(String(p.speed)))q('speed').value=String(p.speed);if(['continuous','stop_turn'].includes(m.motion)){motion=m.motion;t=Math.max(0,Math.min(end(),Number(p.time)||0));}else t=0;}
